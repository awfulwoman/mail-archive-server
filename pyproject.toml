[project]
name = "mail-archive-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.27",
    "uvicorn>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mail-archive-server = "mail_archive_server.main:main"
